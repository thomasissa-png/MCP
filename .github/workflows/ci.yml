name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un seul run par ref : annule les runs obsoletes sur push successifs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Unit · E2E · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Node natif, pas de reseau externe requis par la suite (mailer console, SQLite local).
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (next lint)
        run: npm run lint

      - name: Anti-placeholder (aucune cle de test/placeholder dans src/)
        run: |
          if grep -REn "sk_test_|pk_test_|re_xxxx|=xxx\b|PLACEHOLDER_KEY" src/; then
            echo "::error::Cle placeholder detectee dans src/ — deploiement bloque."
            exit 1
          fi
          echo "OK : aucun placeholder de cle dans src/."

      - name: Build (next build)
        run: npm run build

      - name: Tests unitaires (Vitest)
        run: npm run test:unit

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tests E2E (Playwright)
        # webServer prepare la DB E2E (migrations + seed) PUIS demarre next start (port dynamique,
        # teardown automatique). Aucun seed manuel a l'exterieur : tout est encapsule dans le webServer.
        run: npm run test:e2e

      - name: Archiver le rapport E2E en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# Deploiement Cloudflare (Pages/Workers via cloudflare/wrangler-action, preview par PR, prod sur merge
# main) a ajouter dans un workflow deploy.yml distinct une fois la cible CF provisionnee (token scope
# projet + secrets GitHub Actions). Pipeline actuel : typecheck -> lint -> anti-placeholder -> build ->
# unit -> e2e (< 10 min). Ne pas modifier sans verifier la coherence avec la strategie @qa.
